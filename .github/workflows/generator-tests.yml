name: IMS generator regression tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  generator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
